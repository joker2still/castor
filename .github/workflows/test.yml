name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Syntax check against Python 3.11 grammar
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          errors = []
          for glob in ("*.py", "tests/*.py", "skills/*.py"):
              for p in pathlib.Path(".").glob(glob):
                  if p.stem.startswith(".") or p.stem == "setup":
                      continue
                  try:
                      ast.parse(p.read_text(encoding="utf-8"),
                                filename=str(p),
                                feature_version=(3, 11))
                  except SyntaxError as e:
                      errors.append(f"{p}:{e.lineno}: {e.msg}")
          if errors:
              print("\n".join(errors)); sys.exit(1)
          print("ok — all files valid Python 3.11 syntax")
          PY

      - name: JS syntax check for static/index.html
        run: python scripts/check_js.py

      - name: Import-time smoke (surfaces runtime SyntaxError / ImportError)
        run: |
          python -c "
          import agent, agent_loop, tools, server, memory, rag, providers
          import scheduler, tasks, soul, threads, vault, mcp_client, presets
          import config, cli, db, discovery, synthesis, telegram_bot, stt, tts
          import updater, utils, logger, inference_setup
          from server import app  # force middleware stack construction
          print('all modules import cleanly')
          "

      - name: Run tests with coverage
        run: pytest tests/ -v --cov --cov-report=term --cov-report=xml

      - name: Publish coverage to job summary
        if: always()
        shell: bash
        run: |
          echo "### Test coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report | tail -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
